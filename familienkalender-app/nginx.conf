server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Für ein sich häufig änderndes internes Tool: nie cachen,
    # damit Updates sofort ankommen (wichtig für den iPad-Kiosk).
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # Rezeptkarte von HelloFresh, gleichursprünglich durchgereicht.
    #
    # Warum der Umweg: hellofresh.de liefert die PDFs zwar ohne Anmeldung aus, setzt aber
    # X-Frame-Options: SAMEORIGIN - direkt in ein <iframe> geladen bliebe die Karte leer.
    # Hier fällt der Kopf weg, und die Datei kommt aus derselben Herkunft wie die App.
    #
    # Die Adresse ist bewusst eng gefasst (24-stellige Rezept-ID, feste Endung), damit aus
    # dem Proxy keine allgemeine Weiterleitung auf hellofresh.de wird.
    location ~ "^/rezeptkarte/([0-9a-f]{24})-de-DE\.pdf$" {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://www.hellofresh.de/recipecards/card/$1-de-DE.pdf;
        proxy_ssl_server_name on;
        proxy_set_header Host www.hellofresh.de;
        proxy_hide_header X-Frame-Options;

        # HelloFresh schickt "Content-Disposition: attachment" mit. Safari auf dem iPad
        # nimmt das wörtlich und lädt die Karte herunter, statt sie im Rahmen zu zeigen.
        # "inline" dreht das um - ohne diese Zeile ist der ganze Dialog wirkungslos.
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "inline";

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        # Cloudflare hängt ein __cf_bm-Cookie für hellofresh.de an. Der Browser würde es
        # ohnehin verwerfen (fremde Domain) - hier bleibt es gleich ganz draußen.
        proxy_hide_header Set-Cookie;

        # Ausnahme vom no-store weiter oben: Eine Rezeptkarte ändert sich nicht mehr, ist
        # aber bis zu 5 MB groß. Ohne das lädt das Wandtablet sie bei jedem Öffnen neu.
        # "expires off" schaltet das geerbte "expires -1" ab, das eigene add_header
        # verdrängt das geerbte no-store - sonst stünden zwei Cache-Control-Köpfe da.
        expires off;
        add_header Cache-Control "public, max-age=604800";
    }
}
